name: Bug 报告
description: 报告可以稳定复现的功能问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请勿提交 API Key、客户数据或原始业务文件；安全问题请使用私密漏洞报告。
  - type: input
    id: versions
    attributes:
      label: 版本信息
      description: 插件、DSH、Node.js、操作系统和浏览器版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 使用脱敏数据写出最短复现步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志或截图
      description: 请先删除密钥、路径中的个人信息和业务数据。
